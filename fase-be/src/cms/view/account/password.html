{{#extend "title"}}Đổi mật khẩu{{/extend}}
<div class="row"><div class="col-md-6 col-lg-5">
    <div class="card">
        <form method="post" action="/cms/account/password">
            <div class="card-body">
                <div class="form-group">
                    <label for="currentPassword">Mật khẩu hiện tại</label>
                    <input id="currentPassword" name="currentPassword" type="password" class="form-control" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password">
                    <small class="text-muted">Ít nhất 8 ký tự.</small>
                </div>
                <div class="form-group mb-0">
                    <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password">
                </div>
            </div>
            <div class="card-footer"><button type="submit" class="btn btn-primary">Lưu mật khẩu</button></div>
        </form>
    </div>
</div></div>
