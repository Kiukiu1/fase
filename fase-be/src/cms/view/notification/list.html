{{#extend "title"}}Thông báo{{/extend}}
<div class="d-flex mb-3">
    <form method="post" action="/cms/notifications/read-all" class="ml-auto m-0">
        <button type="submit" class="btn btn-default btn-sm"><i class="fas fa-check-double mr-1"></i> Đánh dấu tất cả đã đọc</button>
    </form>
</div>
<div class="card">
    <ul class="list-group list-group-flush">
        {{#each items}}
        <li class="list-group-item d-flex align-items-start {{#unless readAt}}unread{{/unless}}">
            <i class="fas fa-bell mr-3 mt-1 text-muted"></i>
            <div class="flex-fill">
                <div>{{content}}</div>
                <div class="text-muted small">{{vnDateTime dateCreated}}</div>
            </div>
            {{#if leadId}}<a href="/cms/leads/{{leadId}}" class="btn-icon" title="Xem LEAD"><i class="fas fa-eye"></i></a>{{/if}}
        </li>
        {{else}}
        <li class="list-group-item text-muted">Chưa có thông báo.</li>
        {{/each}}
    </ul>
</div>
{{> paging}}
